# Configuration de l'analyse SonarQube Cloud (monorepo back + front)
sonar.organization=brunohoarau
sonar.projectKey=brunoHoarau_Hoarau_Bruno_09_G-rez_un_projet_d-int-gration_et_de_d-ploiement_continu
sonar.projectName=MicroCRM

sonar.sourceEncoding=UTF-8

# Sources et tests
sonar.sources=back/src/main/java,front/src
sonar.tests=back/src/test/java,front/src
sonar.test.inclusions=front/src/**/*.spec.ts
sonar.exclusions=front/src/**/*.spec.ts,front/src/assets/**

# Back-end (Java)
sonar.java.source=17
sonar.java.binaries=back/build/classes/java/main
sonar.java.test.binaries=back/build/classes/java/test
sonar.coverage.jacoco.xmlReportPaths=back/build/reports/jacoco/test/jacocoTestReport.xml
sonar.junit.reportPaths=back/build/test-results/test

# Front-end (TypeScript)
sonar.javascript.lcov.reportPaths=front/coverage/microcrm/lcov.info
